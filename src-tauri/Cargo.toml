[package]
name = "safterm"
version = "0.14.5"
description = "Open-Source AI-Native Terminal Built for Seamless Workflows"
authors = ["Irfan Saf"]
license = "Apache-2.0"
repository = "https://github.com/irfansaf/safterm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "safterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
dirs = "6"
hostname = "0.4"
whoami = "1"
opener = "0.7"
rfd = "0.15"
base64 = "0.22"
